version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: spend-analytics-db
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-spend_analytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spend_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spend-analytics

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spend-analytics-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spend-analytics

volumes:
  postgres_data:

networks:
  spend-analytics:
    driver: bridge
